[package]
name = "rigol"
description = "Client-side control of RIGOL test instruments over SCPI (raw TCP socket)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = { version = "1.0", optional = true }

[features]
# JSON Schema derives for the parameter enums, for callers that expose them
# as tool arguments. Off by default: the library itself needs no schemas.
schemars = ["dep:schemars"]

[dev-dependencies]
serde_json = { workspace = true }
rigol-fake = { workspace = true }
