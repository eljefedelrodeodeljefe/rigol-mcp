[workspace]
resolver = "3"
members = ["crates/rigol", "crates/rigol-mcp", "crates/rigol-fake"]

[workspace.package]
version = "0.4.0" # x-release-please-version
edition = "2024"
license = "MIT"
repository = "https://github.com/eljefedelrodeodeljefe/rigol-mcp"

[workspace.dependencies]
rigol = { path = "crates/rigol", version = "0.4.0" } # x-release-please-version
rigol-fake = { path = "crates/rigol-fake" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Output goes through `tracing`: stdout carries the MCP JSON-RPC stream.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
